<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컨테이너 분류 & 탄막 회피</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0f;
    height: 100%;
    overflow: hidden;
  }
  #game-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<div id="game-container"></div>
<script>
(function () {
  'use strict';

  const WIDTH = 800;
  const HEIGHT = 600;

  const BELT_Y_TOP = 520;
  const BELT_Y_BOTTOM = 585;
  const BELT_X_LEFT = 140;
  const BELT_X_RIGHT = 660;

  const RED_BOX = { x: 20, y: 495, w: 110, h: 95 };
  const BLUE_BOX = { x: 670, y: 495, w: 110, h: 95 };

  const PLAYER_BOUNDS = { minX: 20, minY: 50, maxX: 780, maxY: 585 };

  class MainScene extends Phaser.Scene {
    constructor() {
      super('main');
    }

    create() {
      // ---- state ----
      this.score = 0;
      this.life = 5;
      this.carrying = null; // 'red' | 'blue' | null
      this.invulnerableUntil = 0;
      this.gameOver = false;
      this.lastItemSpawn = 0;
      this.itemSpawnInterval = 1300;

      // ---- background zones ----
      this.add.rectangle(WIDTH / 2, 20, WIDTH, 40, 0x1c1c26);
      this.add.rectangle(WIDTH / 2, 70, WIDTH, 60, 0x1a1626);
      this.add.rectangle(WIDTH / 2, (100 + BELT_Y_TOP) / 2, WIDTH, BELT_Y_TOP - 100, 0x0e2230);

      this.beltGfx = this.add.graphics();
      this.drawBelt(0);

      // ---- sorting boxes ----
      this.add.rectangle(
        RED_BOX.x + RED_BOX.w / 2, RED_BOX.y + RED_BOX.h / 2,
        RED_BOX.w, RED_BOX.h, 0x7a0000
      ).setStrokeStyle(4, 0xff5555);
      this.add.text(
        RED_BOX.x + RED_BOX.w / 2, RED_BOX.y + RED_BOX.h / 2,
        'RED', { fontSize: '20px', color: '#ffffff', fontFamily: 'Arial', fontStyle: 'bold' }
      ).setOrigin(0.5);

      this.add.rectangle(
        BLUE_BOX.x + BLUE_BOX.w / 2, BLUE_BOX.y + BLUE_BOX.h / 2,
        BLUE_BOX.w, BLUE_BOX.h, 0x00006e
      ).setStrokeStyle(4, 0x5599ff);
      this.add.text(
        BLUE_BOX.x + BLUE_BOX.w / 2, BLUE_BOX.y + BLUE_BOX.h / 2,
        'BLUE', { fontSize: '20px', color: '#ffffff', fontFamily: 'Arial', fontStyle: 'bold' }
      ).setOrigin(0.5);

      // ---- world bounds (constrain player roaming area) ----
      this.physics.world.setBounds(
        PLAYER_BOUNDS.minX, PLAYER_BOUNDS.minY,
        PLAYER_BOUNDS.maxX - PLAYER_BOUNDS.minX,
        PLAYER_BOUNDS.maxY - PLAYER_BOUNDS.minY
      );

      // ---- player ----
      this.player = this.add.rectangle(WIDTH / 2, 300, 30, 30, 0x00ff88);
      this.physics.add.existing(this.player);
      this.player.body.setCollideWorldBounds(true);

      this.carryIndicator = this.add.circle(this.player.x, this.player.y - 25, 8, 0xffffff)
        .setVisible(false).setStrokeStyle(2, 0x222222);

      this.cursors = this.input.keyboard.createCursorKeys();

      // ---- groups ----
      this.bullets = this.physics.add.group();
      this.items = this.physics.add.group();
      this.enemies = this.add.group();

      const enemyCount = 5;
      for (let i = 0; i < enemyCount; i++) {
        const ex = 100 + i * 150;
        const enemy = this.add.rectangle(ex, 65, 40, 24, 0xff5555).setStrokeStyle(2, 0xffaaaa);
        enemy.baseX = ex;
        enemy.phase = Math.random() * Math.PI * 2;
        enemy.nextFire = 500 + Math.random() * 1000;
        this.enemies.add(enemy);
      }

      // ---- UI ----
      this.scoreText = this.add.text(20, 8, 'Score: 0', {
        fontSize: '20px', color: '#ffffff', fontFamily: 'Arial'
      }).setDepth(20);

      this.lifeText = this.add.text(WIDTH - 150, 8, 'Life: 5', {
        fontSize: '20px', color: '#ff8888', fontFamily: 'Arial'
      }).setDepth(20);

      this.add.text(WIDTH / 2, 12, '방향키 이동 | 탄막 피하기 | 물건을 옮겨 상자에 배달', {
        fontSize: '13px', color: '#aaaaaa', fontFamily: 'Arial'
      }).setOrigin(0.5, 0).setDepth(20);

      this.messageText = this.add.text(WIDTH / 2, HEIGHT / 2, '', {
        fontSize: '36px', color: '#ffffff', fontFamily: 'Arial', align: 'center'
      }).setOrigin(0.5).setDepth(30);

      // ---- collisions ----
      this.physics.add.overlap(this.player, this.bullets, this.hitBullet, null, this);
      this.physics.add.overlap(this.player, this.items, this.hitItem, null, this);

      this.input.keyboard.on('keydown-R', () => {
        if (this.gameOver) this.scene.restart();
      });
    }

    drawBelt(offset) {
      this.beltGfx.clear();
      this.beltGfx.fillStyle(0x3a3a3a, 1);
      this.beltGfx.fillRect(BELT_X_LEFT, BELT_Y_TOP, BELT_X_RIGHT - BELT_X_LEFT, BELT_Y_BOTTOM - BELT_Y_TOP);
      this.beltGfx.fillStyle(0x555555, 1);
      const stripeW = 20;
      const start = BELT_X_LEFT - stripeW + (offset % stripeW);
      for (let x = start; x < BELT_X_RIGHT; x += stripeW) {
        this.beltGfx.fillRect(x, BELT_Y_TOP, 8, BELT_Y_BOTTOM - BELT_Y_TOP);
      }
    }

    spawnItem() {
      const isRed = Math.random() < 0.5;
      const x = Phaser.Math.Between(BELT_X_LEFT + 30, BELT_X_RIGHT - 30);
      const y = BELT_Y_TOP + (BELT_Y_BOTTOM - BELT_Y_TOP) / 2;
      const item = this.add.circle(x, y, 14, isRed ? 0xff3333 : 0x3333ff);
      item.setStrokeStyle(2, 0xffffff);
      this.physics.add.existing(item);
      item.body.setCircle(14);
      item.itemColor = isRed ? 'red' : 'blue';
      const dir = x < (BELT_X_LEFT + BELT_X_RIGHT) / 2 ? -1 : 1;
      item.body.setVelocityX(dir * (25 + Math.random() * 20));
      this.items.add(item);
    }

    spawnEnemyBullet(enemy) {
      const angles = [-0.3, 0, 0.3];
      angles.forEach((a) => {
        const b = this.add.circle(enemy.x, enemy.y + 15, 6, 0xffcc00);
        this.physics.add.existing(b);
        b.body.setCircle(6);
        const speed = 180;
        b.body.setVelocity(Math.sin(a) * speed, Math.cos(a) * speed);
        this.bullets.add(b);
      });
    }

    hitBullet(playerObj, bullet) {
      bullet.destroy();
      if (this.gameOver) return;
      const now = this.time.now;
      if (now < this.invulnerableUntil) return;
      this.life--;
      this.lifeText.setText('Life: ' + Math.max(this.life, 0));
      this.invulnerableUntil = now + 1000;
      if (this.life <= 0) {
        this.endGame();
      }
    }

    hitItem(playerObj, item) {
      if (this.carrying || this.gameOver) return;
      this.carrying = item.itemColor;
      this.carryIndicator.setFillStyle(item.itemColor === 'red' ? 0xff3333 : 0x3333ff);
      this.carryIndicator.setVisible(true);
      item.destroy();
    }

    checkDelivery() {
      if (!this.carrying || this.gameOver) return;
      const px = this.player.x, py = this.player.y;
      const inRed = px > RED_BOX.x && px < RED_BOX.x + RED_BOX.w && py > RED_BOX.y && py < RED_BOX.y + RED_BOX.h;
      const inBlue = px > BLUE_BOX.x && px < BLUE_BOX.x + BLUE_BOX.w && py > BLUE_BOX.y && py < BLUE_BOX.y + BLUE_BOX.h;
      if (inRed || inBlue) {
        const correct = (inRed && this.carrying === 'red') || (inBlue && this.carrying === 'blue');
        this.score += correct ? 10 : -5;
        if (this.score < 0) this.score = 0;
        this.scoreText.setText('Score: ' + this.score);
        this.carrying = null;
        this.carryIndicator.setVisible(false);
      }
    }

    endGame() {
      this.gameOver = true;
      this.player.body.setVelocity(0, 0);
      this.bullets.getChildren().forEach((b) => b.body.setVelocity(0, 0));
      this.items.getChildren().forEach((it) => it.body.setVelocity(0, 0));
      this.messageText.setText('GAME OVER\nScore: ' + this.score + '\nPress R to Restart');
    }

    update(time, delta) {
      if (this.gameOver) return;

      this.drawBelt(Math.floor(time / 30));

      // player movement
      const speed = 260;
      let vx = 0, vy = 0;
      if (this.cursors.left.isDown) vx = -speed;
      else if (this.cursors.right.isDown) vx = speed;
      if (this.cursors.up.isDown) vy = -speed;
      else if (this.cursors.down.isDown) vy = speed;
      this.player.body.setVelocity(vx, vy);

      // invulnerability blink
      if (time < this.invulnerableUntil) {
        this.player.setFillStyle(Math.floor(time / 100) % 2 === 0 ? 0xffffff : 0x00ff88);
      } else {
        this.player.setFillStyle(0x00ff88);
      }

      this.carryIndicator.setPosition(this.player.x, this.player.y - 25);

      // enemies: sway + fire
      this.enemies.getChildren().forEach((enemy) => {
        enemy.x = enemy.baseX + Math.sin(time / 800 + enemy.phase) * 60;
        enemy.nextFire -= delta;
        if (enemy.nextFire <= 0) {
          this.spawnEnemyBullet(enemy);
          enemy.nextFire = 500 + Math.random() * 700;
        }
      });

      // cleanup bullets off-screen
      this.bullets.getChildren().slice().forEach((b) => {
        if (b.y > HEIGHT + 30 || b.y < -30 || b.x < -30 || b.x > WIDTH + 30) b.destroy();
      });

      // spawn + cleanup items
      if (time - this.lastItemSpawn > this.itemSpawnInterval) {
        this.spawnItem();
        this.lastItemSpawn = time;
      }
      this.items.getChildren().slice().forEach((item) => {
        if (item.x < BELT_X_LEFT - 20 || item.x > BELT_X_RIGHT + 20) {
          item.destroy();
          this.score = Math.max(0, this.score - 3);
          this.scoreText.setText('Score: ' + this.score);
        }
      });

      this.checkDelivery();
    }
  }

  const config = {
    type: Phaser.AUTO,
    width: WIDTH,
    height: HEIGHT,
    parent: 'game-container',
    backgroundColor: '#0d0d1a',
    physics: {
      default: 'arcade',
      arcade: { gravity: { y: 0 }, debug: false }
    },
    scene: MainScene
  };

  new Phaser.Game(config);
})();
</script>
</body>
</html>
