<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컨테이너 분류 & 탄막 회피</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0f;
    height: 100%;
    overflow: hidden;
  }
  #game-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas {
    display: block;
    cursor: none;
  }
</style>
</head>
<body>
<div id="game-container"></div>
<script>
(function () {
  'use strict';

  const WIDTH = 800;
  const HEIGHT = 600;

  const BELT_Y_TOP = 520;
  const BELT_Y_BOTTOM = 585;
  const BELT_X_LEFT = 60;
  const BELT_X_RIGHT = 740;
  const ITEM_SPAWN_X = BELT_X_LEFT + 30;
  const ITEM_LOST_X = BELT_X_RIGHT + 20;

  const RED_BOX = { x: 20, y: 430, w: 150, h: 70 };
  const INCINERATOR = { x: 325, y: 430, w: 150, h: 70 };
  const BLUE_BOX = { x: 630, y: 430, w: 150, h: 70 };

  const PLAYER_BOUNDS = { minX: 20, minY: 90, maxX: 780, maxY: 585 };

  class MainScene extends Phaser.Scene {
    constructor() {
      super('main');
    }

    create() {
      // ---- state ----
      this.score = 0;
      this.life = 5;
      this.carriedItem = null; // the actual item GameObject currently held, or null
      this.invulnerableUntil = 0;
      this.gameOver = false;
      this.lastItemSpawn = 0;
      this.itemSpawnInterval = 1100;
      this.grabRadius = 26;

      // ---- background zones ----
      this.add.rectangle(WIDTH / 2, 20, WIDTH, 40, 0x1c1c26);
      this.add.rectangle(WIDTH / 2, 70, WIDTH, 60, 0x1a1626);
      this.add.rectangle(WIDTH / 2, (100 + BELT_Y_TOP) / 2, WIDTH, BELT_Y_TOP - 100, 0x0e2230);

      this.beltGfx = this.add.graphics();
      this.drawBelt(0);

      // ---- sorting destinations ----
      this.add.rectangle(
        RED_BOX.x + RED_BOX.w / 2, RED_BOX.y + RED_BOX.h / 2,
        RED_BOX.w, RED_BOX.h, 0x7a0000
      ).setStrokeStyle(4, 0xff5555);
      this.add.text(
        RED_BOX.x + RED_BOX.w / 2, RED_BOX.y + RED_BOX.h / 2,
        'RED', { fontSize: '20px', color: '#ffffff', fontFamily: 'Arial', fontStyle: 'bold' }
      ).setOrigin(0.5);

      this.add.rectangle(
        BLUE_BOX.x + BLUE_BOX.w / 2, BLUE_BOX.y + BLUE_BOX.h / 2,
        BLUE_BOX.w, BLUE_BOX.h, 0x00006e
      ).setStrokeStyle(4, 0x5599ff);
      this.add.text(
        BLUE_BOX.x + BLUE_BOX.w / 2, BLUE_BOX.y + BLUE_BOX.h / 2,
        'BLUE', { fontSize: '20px', color: '#ffffff', fontFamily: 'Arial', fontStyle: 'bold' }
      ).setOrigin(0.5);

      this.incineratorRect = this.add.rectangle(
        INCINERATOR.x + INCINERATOR.w / 2, INCINERATOR.y + INCINERATOR.h / 2,
        INCINERATOR.w, INCINERATOR.h, 0x3a1400
      ).setStrokeStyle(4, 0xff8800);
      this.add.text(
        INCINERATOR.x + INCINERATOR.w / 2, INCINERATOR.y + INCINERATOR.h / 2,
        '소각로', { fontSize: '18px', color: '#ffcc88', fontFamily: 'Arial', fontStyle: 'bold' }
      ).setOrigin(0.5);

      // ---- player (mouse-controlled gripper) ----
      this.player = this.add.circle(WIDTH / 2, 250, 16, 0x00ff88);
      this.player.setStrokeStyle(2, 0xffffff);
      this.player.setDepth(15);
      this.physics.add.existing(this.player);
      this.player.body.setCircle(16);

      // ---- groups ----
      this.bullets = this.physics.add.group();
      this.items = this.physics.add.group();
      this.enemies = this.add.group();

      const enemyCount = 6;
      for (let i = 0; i < enemyCount; i++) {
        const ex = 80 + i * 128;
        const enemy = this.add.rectangle(ex, 65, 40, 24, 0xff5555).setStrokeStyle(2, 0xffaaaa);
        enemy.baseX = ex;
        enemy.phase = Math.random() * Math.PI * 2;
        // fire almost immediately so bullets are clearly visible from the start
        enemy.nextFire = 200 + Math.random() * 400;
        this.enemies.add(enemy);
      }

      // ---- UI ----
      this.scoreText = this.add.text(20, 8, 'Score: 0', {
        fontSize: '20px', color: '#ffffff', fontFamily: 'Arial'
      }).setDepth(20);

      this.lifeText = this.add.text(WIDTH - 150, 8, 'Life: 5', {
        fontSize: '20px', color: '#ff8888', fontFamily: 'Arial'
      }).setDepth(20);

      this.add.text(WIDTH / 2, 12, '마우스 이동 · 탄막 피하기 | 물건 클릭해서 잡고 상자/소각로로 드래그', {
        fontSize: '13px', color: '#aaaaaa', fontFamily: 'Arial'
      }).setOrigin(0.5, 0).setDepth(20);

      this.messageText = this.add.text(WIDTH / 2, HEIGHT / 2, '', {
        fontSize: '36px', color: '#ffffff', fontFamily: 'Arial', align: 'center'
      }).setOrigin(0.5).setDepth(30);

      // ---- collisions ----
      this.physics.add.overlap(this.player, this.bullets, this.hitBullet, null, this);

      this.input.keyboard.on('keydown-R', () => {
        if (this.gameOver) this.scene.restart();
      });
      this.input.on('pointerdown', (pointer) => {
        if (this.gameOver) {
          this.scene.restart();
          return;
        }
        this.tryGrabItem(pointer);
      });
    }

    tryGrabItem(pointer) {
      if (this.carriedItem) return;
      let closest = null;
      let closestDist = this.grabRadius;
      this.items.getChildren().forEach((item) => {
        const d = Phaser.Math.Distance.Between(pointer.x, pointer.y, item.x, item.y);
        if (d < closestDist) {
          closest = item;
          closestDist = d;
        }
      });
      if (closest) {
        this.carriedItem = closest;
        this.carriedItem.body.setVelocity(0, 0);
        this.carriedItem.setDepth(16);
        this.carriedItem.setStrokeStyle(3, 0xffffff);
      }
    }

    drawBelt(offset) {
      this.beltGfx.clear();
      this.beltGfx.fillStyle(0x3a3a3a, 1);
      this.beltGfx.fillRect(BELT_X_LEFT, BELT_Y_TOP, BELT_X_RIGHT - BELT_X_LEFT, BELT_Y_BOTTOM - BELT_Y_TOP);
      this.beltGfx.fillStyle(0x555555, 1);
      const stripeW = 20;
      const start = BELT_X_LEFT - stripeW + (offset % stripeW);
      for (let x = start; x < BELT_X_RIGHT; x += stripeW) {
        this.beltGfx.fillRect(x, BELT_Y_TOP, 8, BELT_Y_BOTTOM - BELT_Y_TOP);
      }
    }

    spawnItem() {
      const roll = Math.random();
      const type = roll < 0.2 ? 'defective' : (roll < 0.6 ? 'red' : 'blue');
      const y = BELT_Y_TOP + (BELT_Y_BOTTOM - BELT_Y_TOP) / 2;
      let item;
      if (type === 'defective') {
        item = this.add.circle(ITEM_SPAWN_X, y, 14, 0x2b2b2b);
        item.setStrokeStyle(3, 0xff2222);
      } else {
        item = this.add.circle(ITEM_SPAWN_X, y, 14, type === 'red' ? 0xff3333 : 0x3333ff);
        item.setStrokeStyle(2, 0xffffff);
      }
      this.physics.add.existing(item);
      item.body.setCircle(14);
      item.itemType = type;
      this.items.add(item);
      item.body.setVelocityX(45 + Math.random() * 25);
    }

    spawnEnemyBullet(enemy) {
      const angles = [-0.4, -0.2, 0, 0.2, 0.4];
      angles.forEach((a) => {
        const b = this.add.circle(enemy.x, enemy.y + 15, 8, 0xffaa00);
        b.setStrokeStyle(2, 0xffffff);
        this.physics.add.existing(b);
        b.body.setCircle(8);
        this.bullets.add(b);
        const speed = 190;
        b.body.setVelocity(Math.sin(a) * speed, Math.cos(a) * speed);
      });
    }

    hitBullet(playerObj, bullet) {
      bullet.destroy();
      if (this.gameOver) return;
      const now = this.time.now;
      if (now < this.invulnerableUntil) return;
      this.life--;
      this.lifeText.setText('Life: ' + Math.max(this.life, 0));
      this.invulnerableUntil = now + 1000;
      if (this.life <= 0) {
        this.endGame();
      }
    }

    checkDelivery() {
      if (!this.carriedItem || this.gameOver) return;
      const px = this.player.x, py = this.player.y;
      const inRed = px > RED_BOX.x && px < RED_BOX.x + RED_BOX.w && py > RED_BOX.y && py < RED_BOX.y + RED_BOX.h;
      const inBlue = px > BLUE_BOX.x && px < BLUE_BOX.x + BLUE_BOX.w && py > BLUE_BOX.y && py < BLUE_BOX.y + BLUE_BOX.h;
      const inIncin = px > INCINERATOR.x && px < INCINERATOR.x + INCINERATOR.w && py > INCINERATOR.y && py < INCINERATOR.y + INCINERATOR.h;
      if (inRed || inBlue || inIncin) {
        const carriedType = this.carriedItem.itemType;
        const correct = (inRed && carriedType === 'red') ||
                         (inBlue && carriedType === 'blue') ||
                         (inIncin && carriedType === 'defective');
        this.score += correct ? 10 : -5;
        if (this.score < 0) this.score = 0;
        this.scoreText.setText('Score: ' + this.score);
        if (inIncin) {
          this.tweens.add({
            targets: this.incineratorRect,
            fillColor: { from: 0xff8800, to: 0x3a1400 },
            duration: 250,
            onStart: () => this.incineratorRect.setFillStyle(0xff8800)
          });
        }
        this.carriedItem.destroy();
        this.carriedItem = null;
      }
    }

    endGame() {
      this.gameOver = true;
      this.player.body.setVelocity(0, 0);
      this.bullets.getChildren().forEach((b) => b.body.setVelocity(0, 0));
      this.items.getChildren().forEach((it) => it.body.setVelocity(0, 0));
      this.messageText.setText('GAME OVER\nScore: ' + this.score + '\n클릭 또는 R키로 재시작');
    }

    update(time, delta) {
      if (this.gameOver) return;

      this.drawBelt(Math.floor(time / 30));

      // player follows the mouse pointer directly
      const pointer = this.input.activePointer;
      this.player.x = Phaser.Math.Clamp(pointer.x, PLAYER_BOUNDS.minX, PLAYER_BOUNDS.maxX);
      this.player.y = Phaser.Math.Clamp(pointer.y, PLAYER_BOUNDS.minY, PLAYER_BOUNDS.maxY);

      // invulnerability blink
      if (time < this.invulnerableUntil) {
        this.player.setFillStyle(Math.floor(time / 100) % 2 === 0 ? 0xffffff : 0x00ff88);
      } else {
        this.player.setFillStyle(0x00ff88);
      }

      // only the item the player clicked on follows the cursor; everything
      // else keeps drifting along the belt under its own velocity
      if (this.carriedItem) {
        this.carriedItem.x = this.player.x;
        this.carriedItem.y = this.player.y - 26;
      }

      // enemies: sway + fire
      this.enemies.getChildren().forEach((enemy) => {
        enemy.x = enemy.baseX + Math.sin(time / 800 + enemy.phase) * 45;
        enemy.nextFire -= delta;
        if (enemy.nextFire <= 0) {
          this.spawnEnemyBullet(enemy);
          enemy.nextFire = 450 + Math.random() * 500;
        }
      });

      // cleanup bullets off-screen
      this.bullets.getChildren().slice().forEach((b) => {
        if (b.y > HEIGHT + 30 || b.y < -30 || b.x < -30 || b.x > WIDTH + 30) b.destroy();
      });

      // spawn + cleanup items (conveyor always moves them rightward)
      if (time - this.lastItemSpawn > this.itemSpawnInterval) {
        this.spawnItem();
        this.lastItemSpawn = time;
      }
      this.items.getChildren().slice().forEach((item) => {
        if (item === this.carriedItem) return; // held item is exempt from drifting off the end
        if (item.x > ITEM_LOST_X) {
          item.destroy();
          this.score = Math.max(0, this.score - 3);
          this.scoreText.setText('Score: ' + this.score);
        }
      });

      this.checkDelivery();
    }
  }

  const config = {
    type: Phaser.AUTO,
    width: WIDTH,
    height: HEIGHT,
    parent: 'game-container',
    backgroundColor: '#0d0d1a',
    physics: {
      default: 'arcade',
      arcade: { gravity: { y: 0 }, debug: false }
    },
    scene: MainScene
  };

  new Phaser.Game(config);
})();
</script>
</body>
</html>
